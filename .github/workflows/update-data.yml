name: Update investment data

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run update script
        run: python update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "investment-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price-history.json alerts.json
          git diff --quiet --cached || git commit -m "Update prices and alerts"
          git push
